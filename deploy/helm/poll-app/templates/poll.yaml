# poll : page de vote (Flask), pousse chaque vote dans Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 4 }}
spec:
  # Pas de "replicas" : le HPA (plus bas) fixe le nombre de pods. S'il était écrit ici,
  # chaque helm upgrade le remettrait à cette valeur et annulerait le travail du HPA.
  # Un pod doit rester prêt 5 s avant de compter comme disponible (évite d'avancer sur un pod qui plante aussitôt)
  minReadySeconds: 5
  # Mise à jour progressive : un nouveau pod doit être prêt avant qu'un ancien soit retiré
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" (dict "root" $ "component" "poll") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
    spec:
      enableServiceLinks: false
      # Un conteneur arrêté (crash, liveness en échec) est toujours relancé. Seule valeur permise dans un Deployment.
      restartPolicy: Always
      # Délai total entre la demande d'arrêt et l'arrêt forcé (SIGKILL), preStop compris
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          # Les pods poll sont placés de préférence sur des nœuds différents : la panne d'un nœud n'en coupe qu'une partie.
          # "preferred" et pas "required" : avec 2 nœuds, un 3e pod (rolling update, HPA) doit quand même pouvoir démarrer.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "poll-app.selectorLabels" (dict "root" $ "component" "poll") | nindent 20 }}
                # Ne compte que les pods de la même version. Sinon, pendant un rolling update, les anciens pods
                # (encore là) poussent tous les nouveaux sur le même nœud, et ils y restent une fois les anciens partis.
                matchLabelKeys:
                  - pod-template-hash
      containers:
        - name: poll
          image: {{ include "poll-app.image" (dict "root" $ "component" "poll") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: poll-app-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poll-app-secrets
                  key: REDIS_PASSWORD
            # Lu par gunicorn au démarrage : des threads au lieu d'un seul worker synchrone (voir values.yaml)
            - name: GUNICORN_CMD_ARGS
              value: {{ .Values.poll.gunicornArgs | quote }}
          ports:
            - name: http
              containerPort: 80
          # /readyz : Redis joignable. Tant qu'il ne l'est pas, le pod ne reçoit pas de trafic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            # Un pod qui s'arrête est retiré des Services, mais les nœuds et le load balancer l'apprennent
            # avec un peu de retard. Il continue donc à répondre 10 s avant de recevoir SIGTERM.
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            {{- toYaml .Values.poll.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: poll
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 4 }}
spec:
  type: {{ .Values.poll.service.type }}
  selector:
    {{- include "poll-app.selectorLabels" (dict "root" $ "component" "poll") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Ajuste le nombre de pods selon le CPU moyen consommé (mesuré par metrics-server, présent par défaut sur AKS)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poll
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poll
  minReplicas: {{ .Values.poll.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.poll.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.poll.autoscaling.targetCPUUtilizationPercentage }}
---
# Pendant un "kubectl drain" ou une mise à jour des nœuds, Kubernetes n'évince un pod poll
# que s'il en reste au moins un autre prêt
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: poll
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" (dict "root" $ "component" "poll") | nindent 6 }}
