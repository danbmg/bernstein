# poll : page de vote (Flask), pousse chaque vote dans Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 4 }}
spec:
  replicas: {{ .Values.poll.replicas }}
  # Mise à jour progressive : un nouveau pod doit être prêt avant qu'un ancien soit retiré
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" (dict "root" $ "component" "poll") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
    spec:
      enableServiceLinks: false
      containers:
        - name: poll
          image: {{ include "poll-app.image" (dict "root" $ "component" "poll") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: poll-app-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poll-app-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: http
              containerPort: 80
          # /readyz : Redis joignable. Tant qu'il ne l'est pas, le pod ne reçoit pas de trafic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.poll.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: poll
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "poll") | nindent 4 }}
spec:
  type: {{ .Values.poll.service.type }}
  selector:
    {{- include "poll-app.selectorLabels" (dict "root" $ "component" "poll") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
