# result : page des résultats (Node.js + Socket.IO), lit les votes dans PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "result") | nindent 4 }}
spec:
  # Pas de "replicas" : le HPA (plus bas) fixe le nombre de pods
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" (dict "root" $ "component" "result") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poll-app.labels" (dict "root" $ "component" "result") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      # node tourne en PID 1 sans gérer SIGTERM : il ignore le signal et n'est arrêté (SIGKILL) qu'au bout de ce délai.
      # Sans conséquence pour les clients : grâce au preStop, il ne reçoit déjà plus de trafic.
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "poll-app.selectorLabels" (dict "root" $ "component" "result") | nindent 20 }}
                matchLabelKeys:
                  - pod-template-hash
      containers:
        - name: result
          image: {{ include "poll-app.image" (dict "root" $ "component" "result") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: poll-app-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poll-app-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 80
          # /readyz : PostgreSQL répond à SELECT 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "result") | nindent 4 }}
spec:
  type: {{ .Values.result.service.type }}
  # Le client Socket.IO n'utilise que le long-polling : chaque requête d'une session doit arriver au même pod,
  # sinon erreur 400 "Session ID unknown". Sur AKS, ClientIP règle aussi le load balancer Azure en affinité par IP source.
  sessionAffinity: ClientIP
  selector:
    {{- include "poll-app.selectorLabels" (dict "root" $ "component" "result") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "result") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result
  minReplicas: {{ .Values.result.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.result.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.result.autoscaling.targetCPUUtilizationPercentage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: result
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "result") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" (dict "root" $ "component" "result") | nindent 6 }}
