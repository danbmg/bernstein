# PostgreSQL : stockage persistant des votes.
# StatefulSet + volume persistant : les données survivent aux redémarrages et aux déplacements du pod.

# Exécuté par l'image officielle uniquement à la création de la base (volume vide).
# Postgres n'est "prêt" qu'après, donc result et worker ne voient jamais une base sans la table votes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-schema
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
data:
  schema.sql: |
    {{- required "postgres.schema est obligatoire (--set-file postgres.schema=poll-application/schema.sql)" .Values.postgres.schema | nindent 4 }}
---
# Adresse utilisée par result et worker
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "poll-app.selectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Service "headless" exigé par le StatefulSet : donne au pod une identité réseau stable (postgres-0)
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "poll-app.selectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "poll-app.selectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poll-app.labels" (dict "root" $ "component" "postgres") | nindent 8 }}
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poll-app-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            # Postgres 18 : PGDATA est /var/lib/postgresql/18/docker, on monte le dossier parent
            - name: data
              mountPath: /var/lib/postgresql
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # -h 127.0.0.1 : passe par TCP, donc échoue pendant l'initialisation (serveur temporaire sur socket
          # uniquement) et ne réussit qu'une fois schema.sql appliqué
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: schema
          configMap:
            name: postgres-schema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
