# Mots de passe, fournis au déploiement (jamais dans le repo).
apiVersion: v1
kind: Secret
metadata:
  name: poll-app-secrets
  labels:
    {{- include "poll-app.labels" (dict "root" $ "component" "secrets") | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ required "postgres.password est obligatoire (variable POSTGRES_PASSWORD)" .Values.postgres.password | b64enc | quote }}
  REDIS_PASSWORD: {{ include "poll-app.redisPassword" . | b64enc | quote }}
